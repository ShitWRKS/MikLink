# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "it-IT"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  review_details: true
  path_filters:
    - "!*.md"
    - "!**/*.md"
    - "!.specify/**"
    - "!specs/**"
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: true
    base_branches:
      - "develop"

chat:
  auto_reply: true
