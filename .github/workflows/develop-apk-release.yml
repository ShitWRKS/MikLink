name: Develop APK prerelease

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate signing secrets
        env:
          MIKLINK_KEYSTORE_BASE64: ${{ secrets.MIKLINK_KEYSTORE_BASE64 }}
          MIKLINK_KEYSTORE_PASSWORD: ${{ secrets.MIKLINK_KEYSTORE_PASSWORD }}
          MIKLINK_KEY_ALIAS: ${{ secrets.MIKLINK_KEY_ALIAS }}
          MIKLINK_KEY_PASSWORD: ${{ secrets.MIKLINK_KEY_PASSWORD }}
        run: |
          for name in MIKLINK_KEYSTORE_BASE64 MIKLINK_KEYSTORE_PASSWORD MIKLINK_KEY_ALIAS MIKLINK_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::Missing signing secret $name"; exit 1; }
          done
      - name: Prepare metadata and keystore
        id: metadata
        env:
          MIKLINK_KEYSTORE_BASE64: ${{ secrets.MIKLINK_KEYSTORE_BASE64 }}
          MIKLINK_KEYSTORE_PASSWORD: ${{ secrets.MIKLINK_KEYSTORE_PASSWORD }}
          MIKLINK_KEY_ALIAS: ${{ secrets.MIKLINK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          epoch="$(date -u +%s)"; days_since_2020="$(( (epoch - 1577836800) / 86400 ))"; seconds_of_day="$(( epoch % 86400 ))"; version_code="$(( days_since_2020 * 100000 + seconds_of_day ))"
          printf '%s' "$MIKLINK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/miklink-release.p12"
          chmod 600 "$RUNNER_TEMP/miklink-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/miklink-release.p12" -storepass "$MIKLINK_KEYSTORE_PASSWORD" -alias "$MIKLINK_KEY_ALIAS" >/dev/null
          echo "MIKLINK_KEYSTORE_PATH=$RUNNER_TEMP/miklink-release.p12" >> "$GITHUB_ENV"
          echo "MIKLINK_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "MIKLINK_VERSION_NAME=1.0.0-dev.${GITHUB_RUN_NUMBER}+${short_sha}" >> "$GITHUB_ENV"
          echo "apk_name=MikLink-develop-${GITHUB_RUN_NUMBER}-${short_sha}.apk" >> "$GITHUB_OUTPUT"
      - run: ./gradlew check :app:assembleRelease
        env:
          MIKLINK_KEYSTORE_PASSWORD: ${{ secrets.MIKLINK_KEYSTORE_PASSWORD }}
          MIKLINK_KEY_ALIAS: ${{ secrets.MIKLINK_KEY_ALIAS }}
          MIKLINK_KEY_PASSWORD: ${{ secrets.MIKLINK_KEY_PASSWORD }}
      - name: Verify and stage APK
        id: apk
        run: |
          set -euo pipefail
          apksigner_path="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' ! -name '*unsigned*' ! -path '*intermediates*')
          test "${#apks[@]}" -eq 1
          "$apksigner_path" verify --verbose "${apks[0]}"
          mkdir -p dist; cp "${apks[0]}" "dist/${{ steps.metadata.outputs.apk_name }}"
          echo "path=dist/${{ steps.metadata.outputs.apk_name }}" >> "$GITHUB_OUTPUT"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view develop-latest >/dev/null 2>&1 && gh release upload develop-latest "${{ steps.apk.outputs.path }}" --clobber || gh release create develop-latest "${{ steps.apk.outputs.path }}" --title "MikLink develop build" --notes "${MIKLINK_VERSION_NAME}" --prerelease
